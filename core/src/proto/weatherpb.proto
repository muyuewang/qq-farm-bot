syntax = "proto3";

package gamepb.weatherpb;

service WeatherService {
    rpc GetWeatherStatus(GetWeatherStatusRequest) returns (GetWeatherStatusReply);
}

message WeatherStatus {
    int32 type = 1;                // 雷雨阶段：1=30 分钟阶段，2=2 小时阶段
    int32 status = 2;
    int64 start_time = 3;
    int64 end_time = 4;
    int32 source = 5;
    int32 field_8 = 8;
}

message GetWeatherStatusRequest {}
message GetWeatherStatusReply { WeatherStatus weather = 1; }
