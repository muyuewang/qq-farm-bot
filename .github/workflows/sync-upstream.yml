name: Sync Upstream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/xxxscarlxrd404/qq-farm-bot.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check if already in sync
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "in_sync=true" >> $GITHUB_OUTPUT
          else
            echo "in_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Rebase onto upstream/main
        if: steps.check.outputs.in_sync == 'false'
        id: rebase
        continue-on-error: true
        run: |
          git config user.name "muyuewang"
          git config user.email "550975101@qq.com"
          git rebase upstream/main

      - name: Push rebased result
        if: steps.rebase.outcome == 'success'
        run: git push origin main --force-with-lease

      - name: Rollback on conflict
        if: steps.rebase.outcome == 'failure'
        run: git rebase --abort

      - name: Open conflict issue
        if: steps.rebase.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "unknown")
          gh issue create \
            --title "上游同步冲突，需要手动处理" \
            --body "## 上游同步冲突

自动 rebase 上游 https://github.com/xxxscarlxrd404/qq-farm-bot/main 时发生冲突，已回滚。

### 冲突文件
\`\`\`
${CONFLICTS}
\`\`\`

### 解决方法
在本地执行以下命令：

\`\`\`bash
git fetch upstream
git rebase upstream/main
# 解决冲突后
git add <冲突文件>
git rebase --continue
git push origin main --force-with-lease
\`\`\`

冲突通常来自上游改动了本地保留的登录/卡密/后台管理相关文件。" \
            || true
